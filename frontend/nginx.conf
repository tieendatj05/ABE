server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API sang service "backend" trong docker-compose (thay cho Vite dev
    # proxy trong vite.config.js, chỉ có tác dụng lúc `npm run dev`).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: mọi route phía client (React Router) đều trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
