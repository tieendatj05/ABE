spring.application.name=abe-system

spring.datasource.url=jdbc:postgresql://localhost:5432/abe_system
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Khoa bi mat ky JWT (HS256, base64) va thoi gian song cua access token (ms).
# CHI dung cho moi truong local/do an - khi trien khai that phai doi bang bien moi truong.
jwt.secret=s4AXptGQObPCZv5V2EoEMfM0taf7FXGOOxNZgByt61KlethPEZNCmxlB9CmnIjAZz3YMZDOwi0ZsY2FnLWrDug==
jwt.expiration-ms=86400000

# Thu muc luu ciphertext cua file (KHONG luu noi dung file vao DB), tao tu dong neu chua co.
file.storage-dir=storage
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
