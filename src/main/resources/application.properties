spring.application.name=abe-system

spring.datasource.url=jdbc:postgresql://localhost:5432/abe_system
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway la nguon su that duy nhat cho schema (xem db/migration/V1__init.sql) -
# Hibernate chi VALIDATE khop entity <-> bang, khong tu sinh/sua DDL nua.
# baseline-on-migrate=true: neu chay vao 1 DB da co san bang (tao boi ddl-auto=update
# truoc day) ma chua co lich su Flyway, se danh dau "coi nhu V1 da chay roi" thay vi
# thu CREATE TABLE lai (se loi vi bang da ton tai) - an toan cho DB dev hien co lan DB
# moi tinh (vd container Docker) deu chay dung.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Khoa bi mat ky JWT (HS256, base64) va thoi gian song cua access token (ms).
# CHI dung cho moi truong local/do an - khi trien khai that phai doi bang bien moi truong.
jwt.secret=s4AXptGQObPCZv5V2EoEMfM0taf7FXGOOxNZgByt61KlethPEZNCmxlB9CmnIjAZz3YMZDOwi0ZsY2FnLWrDug==
jwt.expiration-ms=86400000

# Noi luu ciphertext cua file (KHONG luu noi dung file vao DB). "minio" = MinIO
# (S3-compatible); "local" = ghi thang ra dia server. Xem package storage/
# (ObjectStorageService). MAC DINH la "local" o day de `mvnw spring-boot:run`
# chay ngay duoc nhu truoc, KHONG bat buoc phai co MinIO dang chay. Khi chay
# qua Docker Compose, bien moi truong STORAGE_TYPE=minio (dat trong
# docker-compose.yml) se ghi de gia tri nay vi luc do MinIO chac chan co san
# trong cung docker network - xem docker-compose.yml).
storage.type=local
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=abe-files
# Chi con y nghia khi storage.type=local (mac dinh).
file.storage-dir=storage

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Chong do mat khau (brute-force): khoa tam tai khoan sau X lan dang nhap sai
# lien tiep, trong Y phut. Xem LoginAttemptService.
security.login.max-attempts=5
security.login.lockout-minutes=15

# Rate limit (chong spam/DDoS) bang Bucket4j - xem RateLimitFilter.
rate-limit.enabled=true
rate-limit.login.max-per-minute=5
rate-limit.download.max-per-minute=30
