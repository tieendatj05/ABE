spring.application.name=abe-system-test

# H2 in-memory thay Postgres khi chay test - khong can DB that.
spring.datasource.url=jdbc:h2:mem:abe_system_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test dung H2 tao lai schema moi lan chay (create-drop) truc tiep tu entity -
# khong dung Flyway o day (V1__init.sql viet cho cu phap Postgres, va create-drop
# moi lan test la du, khong can lich su migration).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=s4AXptGQObPCZv5V2EoEMfM0taf7FXGOOxNZgByt61KlethPEZNCmxlB9CmnIjAZz3YMZDOwi0ZsY2FnLWrDug==
jwt.expiration-ms=86400000

storage.type=local
file.storage-dir=target/test-storage
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tat rate limit mac dinh cho test - nhieu test cung goi /api/auth/login hoac
# /api/files/{id}/download trong cung 1 Spring context (cung bean RateLimitService),
# bat mac dinh se lam test khac ngau nhien bi 429 gia. Test rieng cho rate limit
# (RateLimitFilterIntegrationTest) tu bat lai bang @TestPropertySource rieng.
rate-limit.enabled=false
